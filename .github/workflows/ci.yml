name: CI

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .tool-versions
        cache: pnpm
    - name: Install JS dependencies
      run: pnpm install --frozen-lockfile
    - name: Lint
      run: pnpm run lint
