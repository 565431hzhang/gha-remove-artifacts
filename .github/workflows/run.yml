name: Run

on: [push]

jobs:
  run-action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Run action
      uses: ./
      with:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        age: '1 second'
        skip-tags: true
        skip-recent: 1

  create-test-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Create artifact for testing
      uses: actions/upload-artifact@v4
      with:
        name: test-artifacts
        path: ./
